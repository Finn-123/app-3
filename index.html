:root{--bg:#fafafb;--c:#fff;--tx:#1c1c1e;--mu:#8e8e93;--ln:#eeeef2;--pu:#7c3aed;--re:#e5383b;--or:#f59e0b;--gr:#22a45d;--sh:0 6px 24px #1810200d}
[data-th=dark]{--bg:#000;--c:#1c1c1e;--tx:#f2f2f7;--ln:#38383a;--sh:none}
*{box-sizing:border-box;font-family:-apple-system,system-ui,sans-serif}body{margin:0;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:520px;margin:auto;padding:14px}.card{background:var(--c);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--sh);border:1px solid var(--ln)}
button,input,textarea{font-size:16px}.btn{border:0;border-radius:16px;padding:16px;width:100%;font-weight:600;color:#fff;background:var(--pu);margin-top:8px;position:relative;overflow:hidden;transition:transform .15s;-webkit-tap-highlight-color:transparent}.btn:active{transform:scale(.95)}.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff4 50%,transparent 70%);transform:translateX(-120%)}.btn:active::after{transform:translateX(120%);transition:.5s}.opt{transition:.2s}.opt:active{transform:scale(.97)}.re{background:var(--re)}.gr{background:var(--gr)}.gh{background:var(--ln);color:var(--tx)}.btn[disabled]{opacity:.35}
input[type=text],input[type=password],textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--ln);background:var(--c);color:var(--tx);margin:6px 0}
.top{display:flex;align-items:center;justify-content:space-between}.logo{font-weight:800;font-size:20px}.logo i{display:block;height:3px;width:60%;background:var(--pu);border-radius:2px}
.burger{width:28px;height:22px;position:relative;background:none;border:0}.burger b{position:absolute;left:0;width:100%;height:3px;background:var(--tx);border-radius:2px;transition:.3s}.burger b:nth-child(1){top:2px}.burger b:nth-child(2){top:10px}.burger b:nth-child(3){top:18px}
.burger.x b:nth-child(1){top:10px;transform:rotate(45deg)}.burger.x b:nth-child(2){opacity:0}.burger.x b:nth-child(3){top:10px;transform:rotate(-45deg)}
.menu{background:var(--c);border-radius:16px;box-shadow:var(--sh);border:1px solid var(--ln);overflow:hidden;animation:d .25s}.menu div{padding:15px}.menu div+div{border-top:1px solid var(--ln)}@keyframes d{from{opacity:0;transform:translateY(-8px)}}
.big{display:block;height:110px;font-size:20px;font-weight:700;text-align:left;padding:18px}.pill{font-size:12px;padding:3px 9px;border-radius:99px;color:#fff;font-weight:600}
.hoch{background:var(--re)}.mittel{background:var(--or)}.niedrig{background:var(--gr)}.s-in{background:#f59e0b18;border-color:var(--or)}.s-ab{background:#22a45d18;border-color:var(--gr)}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;animation:d .4s;z-index:9}
.bar{display:flex;gap:6px}.bar i{flex:1;height:6px;border-radius:3px;background:var(--ln);transition:.5s}.bar i.on{background:var(--pu)}
.opt{padding:14px;border:2px solid var(--ln);border-radius:14px;margin:8px 0}.opt.sel{border-color:var(--pu)}.mu{color:var(--mu);font-size:14px}.t{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700}
.ov{position:fixed;inset:0;background:var(--bg);z-index:5;padding:16px;overflow:auto}.chk{stroke-dasharray:60;stroke-dashoffset:60;animation:k .8s .2s forwards}@keyframes k{to{stroke-dashoffset:0}}
